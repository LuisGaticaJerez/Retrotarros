<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETROTARROS · N64 · Coleccion completa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

:root {
  --mg: #FF2E88;
  --cy: #00E5FF;
  --ye: #FFD23F;
  --pu: #2D1B69;
  --bo: #F5F0E8;
  --dk: #06030f;
  --card-bg: rgba(12, 6, 32, 0.92);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--dk);
  font-family: 'Share Tech Mono', monospace;
  color: var(--bo);
}

body {
  background-image:
    radial-gradient(ellipse 100% 50% at 50% -5%, rgba(255,46,136,.12) 0%, transparent 65%),
    repeating-linear-gradient(0deg, transparent 0px, transparent 39px, rgba(255,255,255,.014) 39px, rgba(255,255,255,.014) 40px),
    repeating-linear-gradient(90deg, transparent 0px, transparent 39px, rgba(255,255,255,.014) 39px, rgba(255,255,255,.014) 40px);
}

/* ── HEADER ── */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  z-index: 200;
  background: rgba(6, 3, 15, 0.97);
  border-bottom: 2px solid var(--mg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
}
.hdr-logo { font-family: 'Orbitron'; font-weight: 900; font-size:23px; color: var(--mg); text-shadow: 0 0 14px rgba(255,46,136,.6); letter-spacing: 3px; }
.hdr-tag { font-family: 'Share Tech Mono'; font-size:14px; color: var(--ye); letter-spacing: 3px; }
.hdr-rec { display: flex; align-items: center; gap: 8px; font-family: 'Press Start 2P'; font-size:9px; color: var(--mg); }
.dot { width: 10px; height: 10px; background: var(--mg); border-radius: 50%; animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

/* ── DECK ── */
.deck { position: fixed; top: 56px; left: 0; right: 0; bottom: 64px; overflow: hidden; }
.slide { position: absolute; inset: 0; padding: 32px 48px; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity .22s; }
.slide.active { opacity: 1; pointer-events: auto; }
.slide-num { position: absolute; top: 16px; right: 24px; font-family: 'Press Start 2P'; font-size:10px; color: rgba(255,255,255,.22); letter-spacing: 2px; }

/* ── PORTADA ── */
.portada { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100%; padding: 0; }
.portada .ep-tag { font-family: 'Press Start 2P'; font-size:13px; color: var(--cy); letter-spacing: 5px; margin-bottom: 22px; }
.portada .ep-title { font-family: 'Orbitron'; font-weight: 900; font-size:101px; letter-spacing: 1.5px; line-height: 1; color: #fff; margin-bottom: 22px; }
.portada .ep-title .vs { color: var(--mg); text-shadow: 0 0 26px rgba(255,46,136,.55); }
.portada .ep-sub { font-family: 'Share Tech Mono'; font-size:21px; color: var(--ye); letter-spacing: 4px; margin-bottom: 18px; }
.portada .ep-count { font-family: 'Press Start 2P'; font-size:14px; color: var(--bo); letter-spacing: 4px; padding: 10px 18px; border: 1px solid var(--cy); margin-top: 14px; }

/* ── INDICE ── */
.idx { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 0 24px; }
.idx-title { font-family: 'Press Start 2P'; font-size:16px; color: var(--mg); letter-spacing: 6px; margin-bottom: 22px; text-shadow: 0 0 14px rgba(255,46,136,.5); }
.idx-list { display: flex; flex-direction: column; gap: 7px; min-width: 760px; max-width: 880px; width: 100%; }
.idx-item { display: grid; grid-template-columns: 28px 38px 1fr 130px; gap: 12px; align-items: baseline; padding: 8px 16px; background: rgba(12,6,32,.6); border-left: 3px solid rgba(0,229,255,.25); font-family: 'Share Tech Mono'; font-size:17px; color: var(--bo); }
.idx-item.active { border-left-color: var(--mg); background: rgba(255,46,136,.07); }
.idx-cursor { color: var(--cy); }
.idx-item.active .idx-cursor { color: var(--mg); }
.idx-num { font-family: 'Press Start 2P'; font-size:13px; color: var(--ye); }
.idx-dots { color: rgba(255,255,255,.18); letter-spacing: 2px; }
.idx-count { font-family: 'Press Start 2P'; font-size:12px; color: var(--cy); text-align: right; }
.idx-total { margin-top: 18px; font-family: 'Press Start 2P'; font-size:15px; color: var(--mg); letter-spacing: 5px; text-shadow: 0 0 14px rgba(255,46,136,.5); }
.idx-hint { margin-top: 8px; font-family: 'Share Tech Mono'; font-size:14px; color: rgba(255,255,255,.4); letter-spacing: 3px; }

/* ── SLIDE PANEO · TARROVISION GRANDE ── */
.slide-paneo { display: grid; grid-template-columns: 380px 1fr; gap: 22px; height: 100%; padding: 6px 8px; align-items: stretch; }
.paneo-banner { background: linear-gradient(180deg, rgba(255,46,136,.18) 0%, rgba(45,27,105,.6) 100%); border-left: 5px solid var(--mg); border-radius: 6px; padding: 18px 18px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.paneo-cat-num { font-family: 'Press Start 2P'; font-size:12px; color: var(--ye); letter-spacing: 3px; margin-bottom: 4px; }
.paneo-cat-name { font-family: 'Orbitron'; font-weight: 900; font-size:34px; line-height: 1.15; color: #fff; text-shadow: 0 0 16px rgba(255,46,136,.5); margin-bottom: 6px; letter-spacing: 6px; word-break: keep-all; }
.paneo-cat-count { font-family: 'Press Start 2P'; font-size:13px; color: var(--cy); letter-spacing: 3px; margin-top: 2px; padding-top: 6px; border-top: 1px solid rgba(0,229,255,.25); }
.paneo-tv-wrap { display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }

/* ── TARROVISION CRT ── */
.tarrovision {
  position: relative;
  height: 100%;
  max-height: 860px;
  aspect-ratio: 1 / 1;
  background: linear-gradient(180deg, #1a1a1f 0%, #0d0d12 100%);
  border-radius: 22px;
  padding: 22px 26px;
  box-shadow: 0 0 0 2px rgba(255,255,255,.04), 0 22px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08), inset 0 -2px 0 rgba(0,0,0,.4);
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 12px;
}
.tv-controls-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 6px; }
.tv-led { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ff8fb8 0%, var(--mg) 60%, #7a0030 100%); box-shadow: 0 0 10px rgba(255,46,136,.8), inset 0 0 2px rgba(0,0,0,.5); }
.tv-brand { flex: 1; text-align: center; font-family: 'Press Start 2P'; font-size:13px; color: var(--ye); letter-spacing: 4px; text-shadow: 0 0 8px rgba(255,210,63,.4); }
.tv-channel { font-family: 'Share Tech Mono'; font-size:14px; color: var(--cy); letter-spacing: 2px; padding: 4px 10px; border: 1px solid rgba(0,229,255,.4); border-radius: 2px; background: rgba(0,229,255,.06); }
.tv-screen { position: relative; background: #2a2a2f; border-radius: 14px; padding: 16px; box-shadow: inset 0 0 0 2px #3a3a3f, inset 0 0 14px rgba(0,0,0,.6); min-height: 0; }
.tv-screen-inner { position: relative; width: 100%; height: 100%; background: #000; border-radius: 18px / 8px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), inset 0 0 40px rgba(0,0,0,.95); }
.tv-screen-inner img, .tv-screen-inner video { display: block; width: 100%; height: 100%; object-fit: cover; }
.tv-screen-inner::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.0) 0px, rgba(0,0,0,.0) 2px, rgba(0,0,0,.18) 2px, rgba(0,0,0,.18) 3px); z-index: 3; mix-blend-mode: multiply; }
.tv-screen-inner::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 110% 70% at 50% 0%, rgba(255,255,255,.08) 0%, transparent 55%), radial-gradient(ellipse 90% 50% at 50% 100%, rgba(0,229,255,.06) 0%, transparent 60%); z-index: 4; }
.tv-noscreen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 50%, rgba(45,27,105,.6) 0%, #000 80%), repeating-linear-gradient(0deg, #0a0a14 0px, #0a0a14 1px, #14142a 1px, #14142a 2px); color: rgba(255,255,255,.35); text-align: center; padding: 30px; z-index: 2; }
.tv-noscreen .tv-noscreen-big { font-family: 'Press Start 2P'; font-size:18px; color: var(--mg); letter-spacing: 4px; margin-bottom: 12px; text-shadow: 0 0 12px rgba(255,46,136,.5); }
.tv-noscreen .tv-noscreen-sub { font-family: 'Share Tech Mono'; font-size:14px; letter-spacing: 2px; color: rgba(0,229,255,.55); }
.tv-controls-bottom { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 14px; padding: 4px 6px 0; }
.tv-knob { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #5a5a60 0%, #2a2a30 60%, #0a0a0e 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.15), inset 0 -2px 0 rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.6); position: relative; }
.tv-knob::after { content: ""; position: absolute; top: 6px; left: 50%; width: 2px; height: 10px; background: var(--ye); transform-origin: bottom center; transform: translateX(-50%) rotate(45deg); box-shadow: 0 0 4px rgba(255,210,63,.6); }
.tv-knob.cy::after { background: var(--cy); box-shadow: 0 0 4px rgba(0,229,255,.6); transform: translateX(-50%) rotate(-30deg); }
.tv-speaker { height: 28px; background: repeating-linear-gradient(90deg, #0a0a0e 0px, #0a0a0e 3px, #1a1a1f 3px, #1a1a1f 6px); border-radius: 4px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.6); }

/* ── SLIDE TRIPLE (3 TVs juntas) ── */
.slide-triple { padding: 18px 24px; }
.slide-triple-inner { display: grid; grid-template-rows: auto 1fr; gap: 12px; height: 100%; max-width: 1820px; margin: 0 auto; justify-items: center; }
.triple-head { width: 100%; display: flex; justify-content: center; align-items: center; }
.tv-block-label { font-family: 'Press Start 2P'; font-size:13px; letter-spacing: 4px; padding: 8px 16px; border: 1px solid var(--mg); color: var(--mg); background: rgba(255,46,136,.06); }
.triple-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; min-height: 0; align-items: stretch; justify-items: stretch; width: 100%; }
.triple-cell { display: grid; grid-template-rows: 1fr auto; align-items: stretch; justify-items: center; gap: 10px; min-height: 0; min-width: 0; height: 100%; overflow: hidden; }
.triple-cell .tv-fit { container-type: size; min-height: 0; min-width: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.triple-cell .tv-fit .tarrovision { width: min(100cqh, 100cqw); height: min(100cqh, 100cqw); max-width: none; max-height: none; aspect-ratio: auto; padding: 16px 18px; border-radius: 18px; gap: 10px; }
.triple-cell .tv-brand { font-size:12px; letter-spacing: 3px; }
.triple-cell .tv-channel { font-size:13px; padding: 3px 9px; }
.triple-cell .tv-knob { width: 30px; height: 30px; }
.triple-cell .tv-speaker { height: 24px; }
.triple-cell .tv-noscreen .tv-noscreen-big { font-size:16px; }
.triple-cell .tv-noscreen .tv-noscreen-sub { font-size:13px; }

/* ── NAMEBOX ── */
.tv-namebox { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 22px; border: 1px solid var(--cy); background: rgba(0,229,255,.04); position: relative; border-radius: 2px; max-width: 92%; }
.tv-namebox::before, .tv-namebox::after { content: ""; position: absolute; width: 7px; height: 7px; background: var(--dk); border: 1px solid var(--cy); }
.tv-namebox::before { top: -4px; left: -4px; }
.tv-namebox::after { bottom: -4px; right: -4px; }
.tv-namebox .tv-title { font-family: 'Orbitron'; font-weight: 900; font-size:20px; color: #fff; letter-spacing: .5px; }
.tv-namebox .tv-meta { font-family: 'Share Tech Mono'; font-size:12px; letter-spacing: 2px; color: rgba(0,229,255,.6); }
.tv-namebox.ye { border-color: var(--ye); background: rgba(255,210,63,.04); }
.tv-namebox.ye::before, .tv-namebox.ye::after { border-color: var(--ye); }
.tv-namebox.ye .tv-meta { color: rgba(255,210,63,.6); }

/* ── DIVIDER ── */
.divider { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100%; }
.divider .pre { font-family: 'Press Start 2P'; font-size:13px; letter-spacing: 6px; margin-bottom: 24px; }
.divider .pre.cy { color: var(--cy); }
.divider .pre.mg { color: var(--mg); }
.divider .title { font-family: 'Orbitron'; font-weight: 900; font-size:90px; letter-spacing: 2px; line-height: 1; color: #fff; margin-bottom: 22px; }
.divider .title.cy { color: var(--cy); text-shadow: 0 0 22px rgba(0,229,255,.5); }
.divider .title.mg { color: var(--mg); text-shadow: 0 0 22px rgba(255,46,136,.55); }
.divider .sub { font-family: 'Share Tech Mono'; font-size:21px; color: rgba(255,255,255,.7); letter-spacing: 2px; max-width: 880px; line-height: 1.6; }

/* ── NUMBERS GRID (rarezas + balance) ── */
.slide h1 { font-family: 'Orbitron'; font-weight: 900; font-size:78px; color: #fff; letter-spacing: 1px; text-align: center; margin-bottom: 8px; line-height: 1; }
.slide h2 { font-family: 'Share Tech Mono'; font-size:21px; letter-spacing: 4px; text-align: center; margin-bottom: 26px; color: rgba(255,255,255,.7); }
.slide h2.mg { color: var(--mg); }
.numbers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1340px; margin: 0 auto; padding: 0 30px; }
.num-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,.08); border-top: 3px solid var(--cy); padding: 22px 18px; text-align: center; }
.num-card.mg { border-top-color: var(--mg); }
.num-card.ye { border-top-color: var(--ye); }
.num-card.cy { border-top-color: var(--cy); }
.num-card h3 { font-family: 'Press Start 2P'; font-size:12px; color: var(--ye); letter-spacing: 3px; margin-bottom: 12px; }
.num-card .big { display: block; font-family: 'Orbitron'; font-weight: 900; font-size:87px; color: #fff; line-height: 1; margin-bottom: 8px; }
.num-card.mg .big { color: var(--mg); text-shadow: 0 0 18px rgba(255,46,136,.45); }
.num-card.cy .big { color: var(--cy); text-shadow: 0 0 18px rgba(0,229,255,.45); }
.num-card.ye .big { color: var(--ye); text-shadow: 0 0 18px rgba(255,210,63,.45); }
.num-card p { font-family: 'Share Tech Mono'; font-size:15px; color: rgba(255,255,255,.7); line-height: 1.45; }

/* ── CONSOLAS GRID (bloque especial N64) ── */
.consolas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: 1340px; margin: 0 auto; padding: 0 30px; }
.consola-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,.08); border-top: 3px solid var(--cy); padding: 18px 16px; text-align: center; }
.consola-card.mg { border-top-color: var(--mg); }
.consola-card.ye { border-top-color: var(--ye); }
.consola-card.cy { border-top-color: var(--cy); }
.consola-card h3 { font-family: 'Press Start 2P'; font-size:12px; color: var(--ye); letter-spacing: 3px; margin-bottom: 10px; min-height: 30px; display: flex; align-items: center; justify-content: center; }
.consola-card .tag { display: inline-block; font-family: 'Press Start 2P'; font-size:9px; padding: 4px 8px; border: 1px solid; margin-bottom: 10px; letter-spacing: 2px; }
.consola-card.mg .tag { color: var(--mg); border-color: var(--mg); }
.consola-card.cy .tag { color: var(--cy); border-color: var(--cy); }
.consola-card.ye .tag { color: var(--ye); border-color: var(--ye); }
.consola-card p { font-family: 'Share Tech Mono'; font-size:14px; color: rgba(255,255,255,.7); line-height: 1.5; }

/* ── NAV FOOTER ── */
nav.footer { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: rgba(6, 3, 15, 0.97); border-top: 2px solid var(--cy); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; z-index: 200; }
.nav-btn { background: transparent; border: 2px solid var(--cy); color: var(--cy); font-family: 'Press Start 2P'; font-size:10px; padding: 10px 18px; letter-spacing: 2px; cursor: pointer; transition: all .15s; border-radius: 2px; }
.nav-btn:hover:not(:disabled) { background: var(--cy); color: #000; }
.nav-btn:disabled { opacity: .25; cursor: not-allowed; }
.nav-center { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; margin: 0 24px; }
.nav-counter { font-family: 'Press Start 2P'; font-size:12px; color: var(--mg); letter-spacing: 3px; }
.nav-progress { width: 100%; max-width: 480px; height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
.nav-progress .bar { height: 100%; background: linear-gradient(90deg, var(--mg), var(--cy)); width: 0; transition: width .25s; box-shadow: 0 0 8px rgba(255,46,136,.5); }
.nav-hint { font-family: 'Share Tech Mono'; font-size:13px; color: rgba(255,255,255,.4); letter-spacing: 2px; }
.nav-hint kbd { display: inline-block; padding: 2px 8px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 3px; font-family: 'Share Tech Mono'; font-size:13px; color: var(--ye); margin: 0 2px; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--dk); }
::-webkit-scrollbar-thumb { background: var(--mg); border-radius: 3px; }
</style>
</head>
<body>

<nav class="footer">
  <button class="nav-btn" id="prevBtn">◀ ANTERIOR</button>
  <div class="nav-center">
    <div class="nav-counter" id="counter">01 / 21</div>
    <div class="nav-progress"><div class="bar" id="bar"></div></div>
  </div>
  <div class="nav-hint"><kbd>←</kbd> <kbd>→</kbd> NAVEGAR</div>
  <button class="nav-btn" id="nextBtn">SIGUIENTE ▶</button>
</nav>

<script>
const slides = document.querySelectorAll('.slide');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const counter = document.getElementById('counter');
const bar = document.getElementById('bar');
let current = 0;
const total = slides.length;
function pad(n) { return String(n).padStart(2, '0'); }
function go(i) {
  if (i < 0 || i >= total) return;
  slides[current].classList.remove('active');
  current = i;
  slides[current].classList.add('active');
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
  counter.textContent = pad(current + 1) + ' / ' + pad(total);
  bar.style.width = ((current + 1) / total * 100) + '%';
}
prevBtn.addEventListener('click', () => go(current - 1));
nextBtn.addEventListener('click', () => go(current + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(current + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(current - 1); }
  if (e.key === 'Home') { go(0); }
  if (e.key === 'End') { go(total - 1); }
});
go(0);
</script>

</body>
</html>
